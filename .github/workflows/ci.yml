name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [js, wasm, wasm-gc, native]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7
      - run: moon version --all
      - run: moon update
      - run: moon test --target ${{ matrix.target }}
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # scripts/workflow.py parses ci.yml; PyYAML is not stdlib.
      - run: python3 -m pip install --quiet pyyaml
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7
      - run: moon update
      - run: moon fmt --check
      - run: moon build --target js
      - run: moon build --target js --release
      - run: node scripts/coverage.mjs
      - run: node scripts/perf-check.mjs
      - run: node scripts/bench-smoke.mjs
      - run: node scripts/stats.mjs
      - run: node scripts/interface.mjs
      - run: node scripts/consumer-smoke.mjs
      - run: node scripts/package-smoke.mjs
      - run: node scripts/fields.mjs
      - run: node scripts/invariants.mjs
      - run: node scripts/doc-examples.mjs
      - run: node scripts/attribution.mjs
      - run: node scripts/layers.mjs
      - run: node scripts/cli-contract.mjs
      - run: node scripts/compat.mjs
      - run: node scripts/release-claims.mjs
      - run: node scripts/defect-matrix.mjs --check-anchors
      - run: node scripts/warnings.mjs
      - run: node scripts/examples.mjs
      - run: node scripts/durability.mjs
      - run: node scripts/check.mjs
      - run: python3 -B scripts/reference.py
      - run: python3 -B scripts/followup_reference.py
      - run: python3 -B scripts/delta_reference.py
      - run: python3 -B scripts/robustness.py
      - run: python3 -B scripts/mutation_sweep.py
      - run: python3 -B scripts/workflow.py
      - run: python3 -B scripts/docs.py
      - run: node scripts/doc-commands.mjs
      - run: python3 -B scripts/fuzz.py
      - run: python3 -B scripts/history.py 4 --steps 10 8
      - run: node scripts/integration.mjs
  # The path rules exist for case-insensitive, Unicode-normalising filesystems, and
  # nothing else in this workflow runs on one. A default macOS volume is both, so
  # this job is the only place the portability checks are exercised for real rather
  # than against a constructed collision.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7
      - run: moon version --all
      - run: moon update
      # Confirms the platform assumption above before anything depends on it.
      - name: Confirm the volume is case-insensitive and normalising
        run: |
          cd "$RUNNER_TEMP" && touch CaseProbe.txt
          test -f caseprobe.txt
          python3 -c "import os; open('caf\u00e9.txt','w').write('x'); assert os.path.exists('cafe\u0301.txt')"
      - run: moon test --target js
      - run: moon test --target native
      - run: moon build --target js
      - run: moon build --target js --release
      - run: node scripts/check.mjs
      - run: node scripts/stats.mjs
      - run: node scripts/fields.mjs
      - run: node scripts/invariants.mjs
      - run: node scripts/attribution.mjs
      - run: node scripts/layers.mjs
      - run: node scripts/doc-commands.mjs
      - run: node scripts/consumer-smoke.mjs
      - run: node scripts/package-smoke.mjs
      - run: python3 -B scripts/robustness.py
      - run: python3 -B scripts/mutation_sweep.py
      - run: node scripts/integration.mjs
      # Timings differ by up to a factor of two between platforms and between machines, so
      # this compares against a per-platform baseline and prints its numbers when that
      # platform has none yet.
      - run: node scripts/perf-check.mjs
      # The one check that needs a filesystem too small to hold the snapshot. macOS can
      # make one with hdiutil, without privileges, which is why it runs here.
      - run: node scripts/fault-probe.mjs
  # Windows is the only platform whose rules the other jobs cannot exercise: the
  # adapter's portability check has a win32 branch that refuses device names,
  # `<>|?*` and trailing dots, and nothing else runs it. This job exists to keep
  # that branch honest rather than assumed.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7
      - run: moon version --all
      - run: moon update
      - run: moon test --target js
      - run: moon build --target js
      - run: moon build --target js --release
      - run: node scripts/check.mjs
      - run: node scripts/stats.mjs
      - run: node scripts/fields.mjs
      - run: node scripts/invariants.mjs
      - run: node scripts/attribution.mjs
      - run: node scripts/layers.mjs
      - run: node scripts/doc-commands.mjs
      - run: node scripts/consumer-smoke.mjs
      - run: node scripts/package-smoke.mjs
      # No Windows baseline is recorded yet, so this measures and prints rather than
      # comparing: the numbers in this job's log are how one gets recorded.
      - run: node scripts/perf-check.mjs
      - run: node scripts/integration.mjs
      - run: node scripts/fault-probe.mjs
